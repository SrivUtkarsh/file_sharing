<!DOCTYPE html>
<html>
<head>
    <title>My Files</title>
</head>

<body>

    <h1>My Files</h1>

    {% for file in files %}
        <p>
            {{ file }}
            <a href="/files/{{ file }}">[View]</a>

            <button onclick="deleteFile('{{ file }}')">[Delete]</button>
        </p>
    {% endfor %}
    <script>
        async function deleteFile(filename){
            const response = await fetch(`/files/${filename}`,{
                method:"DELETE"
            });
            if(response.ok){
                location.reload();
            } else{
                alert("Failed to delete ")
            }
        }
    </script>

</body>
</html>
